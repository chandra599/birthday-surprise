<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Cutu Baby ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="loader">
    <div class="heart">❤️</div>

    <h1>Preparing Your Surprise...</h1>

    <div class="loading-bar">
        <div class="loading-progress"></div>
    </div>

    <p>Please wait...</p>
</div>
<section id="hero" class="hidden">
    <div id="stars"></div>
    <div id="hearts"></div>
    <div class="hero-content">
        <div class="cake">🎂</div>
        <h1>Happy Birthday</h1>
        <h2>My Cutu Baby ❤️</h2>
        <p>
            You make my world brighter every single day.
        </p>
        <button id="startBtn">
            🎁 Open My Surprise
        </button>
    </div>
</section> 
<section id="letterSection">
    <div class="envelope-container">
       
    </div>
</section>
<script src="script.js"></script>
</body>
</html>
